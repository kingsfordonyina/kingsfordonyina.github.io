<!-- ===== Custom redesign styles (embedded so they apply site-wide even if the compiled stylesheet lags) ===== -->
<style>
  body{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; color:#24302f; }
  .page__content,.archive{ line-height:1.7; }
  .page__content{ font-size:1.03em; }
  .page__content p{ margin:0 0 1.1em; }
  .page__content h1,.page__content h2,.page__content h3,.archive h2,.archive h3{ color:#134e4a; letter-spacing:-0.01em; }

  .page__content a:not(.ko-btn):not(.ko-pub__link):not(.ko-link-more),
  .archive .archive__item-excerpt a,.archive .wordwrap a{
    color:#0f766e; text-decoration:none; border-bottom:1px solid rgba(15,118,110,0.28);
    transition:color .15s ease,border-color .15s ease;
  }
  .page__content a:not(.ko-btn):hover,.archive .archive__item-excerpt a:hover{ color:#115e59; border-bottom-color:#115e59; }
  .ko-hero a,.ko-btn,.ko-card a,.ko-pub__link,.ko-link-more,.ko-contact__actions a{ border-bottom:0 !important; }
  .ko-about a{ color:#0f766e !important; border-bottom:1px solid rgba(15,118,110,.28) !important; }

  hr{ border:0; height:1px; background:#e7ecea; margin:2em 0; }
  .masthead{ border-bottom:1px solid #e7ecea; box-shadow:0 1px 5px rgba(0,0,0,.03); }
  .greedy-nav{ background:#fff; }
  .greedy-nav a{ font-weight:500; }
  .greedy-nav a:hover{ color:#0f766e; }
  .greedy-nav .visible-links a:before{ background:#0f766e; }
  .btn{ border-radius:8px; }

  /* Page headers on Publications / Teaching / CV */
  .page__title,.archive .page__title{
    font-weight:700; color:#134e4a; letter-spacing:-.01em;
    padding-bottom:.35rem; margin-bottom:1rem; position:relative;
  }
  .page__title:after,.archive .page__title:after{
    content:""; position:absolute; left:0; bottom:0; width:46px; height:3px; border-radius:3px; background:#0f766e;
  }
  .archive > h2,.page__content > h2{
    font-weight:700; color:#134e4a; margin-top:1.6em; padding-bottom:.3rem; border-bottom:2px solid #d9ede8;
  }

  /* Publication / teaching list items -> cards */
  .archive__item{
    background:#fff; border:1px solid #e7ecea; border-left:4px solid #0f766e; border-radius:12px;
    padding:1.25rem 1.4rem; margin:0 0 1.1rem; box-shadow:0 1px 4px rgba(0,0,0,.04);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .archive__item:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(15,118,110,.10); }
  .archive .archive__item a{ text-decoration:none; }
  .archive__item-title{ margin-top:0 !important; font-size:1.15em; line-height:1.35; }
  .archive__item-title a{ color:#134e4a !important; border-bottom:0 !important; }
  .archive__item-title a:hover{ color:#0f766e !important; }
  .archive__item-excerpt{ color:#5c6a68; font-size:.97em; }

  /* Homepage hero (light) */
  .ko-hero{ display:flex; align-items:center; gap:2.25rem; padding:2.4rem 2.3rem; margin:.25rem 0 2.25rem;
    border-radius:18px; background:#f0faf7; border:1px solid #d9ede8; color:#24302f; box-shadow:0 4px 16px rgba(15,118,110,.06); }
  .ko-hero__photo{ flex:0 0 auto; }
  .ko-hero__photo img{ width:168px; height:168px; border-radius:50%; object-fit:cover; border:4px solid #fff;
    box-shadow:0 0 0 1px #d9ede8,0 6px 18px rgba(0,0,0,.10); }
  .ko-hero__text{ flex:1 1 auto; }
  .ko-hero__eyebrow{ text-transform:uppercase; letter-spacing:.12em; font-size:.72em; font-weight:700; margin:0 0 .5em; color:#0f766e; }
  .ko-hero__name{ font-size:2.25em; line-height:1.08; font-weight:700; margin:0 0 .2em; color:#134e4a; letter-spacing:-.015em; }
  .ko-hero__title{ font-size:1.08em; font-weight:500; margin:0 0 .85em; color:#4a5654; }
  .ko-hero__lede{ font-size:1.02em; line-height:1.6; margin:0 0 1.4em; color:#3c4746; max-width:48ch; }
  .ko-hero__actions{ display:flex; flex-wrap:wrap; gap:.65rem; }
  .ko-btn{ display:inline-block; padding:.65em 1.25em; border-radius:9px; font-weight:600; font-size:.96em; text-decoration:none; transition:transform .12s ease,background .15s ease; }
  .ko-btn:hover{ transform:translateY(-1px); }
  .ko-btn--solid{ background:#0f766e; color:#fff !important; box-shadow:0 3px 10px rgba(15,118,110,.18); }
  .ko-btn--solid:hover{ background:#115e59; }
  .ko-btn--ghost{ background:#fff; color:#115e59 !important; border:1.5px solid #d9ede8; }
  .ko-btn--ghost:hover{ background:#f0faf7; border-color:#0f766e; }

  /* Homepage sections + cards */
  .ko-section{ margin:2.25rem 0; }
  .ko-section__head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .ko-section__title{ font-size:1.45em; font-weight:700; color:#134e4a !important; margin:0 0 1rem; letter-spacing:-.01em; padding-bottom:.35rem; position:relative; border-bottom:none; }
  .ko-section__title:after{ content:""; position:absolute; left:0; bottom:0; width:46px; height:3px; border-radius:3px; background:#0f766e; }
  .ko-link-more{ font-weight:600; color:#0f766e !important; text-decoration:none; white-space:nowrap; }
  .ko-about .ko-prose p{ color:#3c4746; margin:0 0 1em; }
  .ko-cards{ display:grid; gap:1.1rem; }
  .ko-cards--3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ko-cards--2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .ko-card{ background:#fff; border:1px solid #e7ecea; border-radius:14px; padding:1.4rem 1.3rem; box-shadow:0 1px 4px rgba(0,0,0,.04); transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease; }
  .ko-card:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(15,118,110,.09); border-color:#d9ede8; }
  .ko-card__icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.25em; color:#115e59; background:#f0faf7; margin-bottom:.9rem; }
  .ko-card__title{ font-size:1.1em; font-weight:700; color:#134e4a !important; margin:0 0 .45rem; }
  .ko-card__body{ margin:0; color:#5c6a68; font-size:.95em; line-height:1.6; }
  .ko-pub{ background:#fff; border:1px solid #e7ecea; border-left:4px solid #0f766e; border-radius:12px; padding:1.4rem; box-shadow:0 1px 4px rgba(0,0,0,.04); transition:transform .15s ease,box-shadow .15s ease; }
  .ko-pub:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(15,118,110,.09); }
  .ko-pub__venue{ display:inline-block; font-size:.74em; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#115e59; background:#f0faf7; padding:.28em .7em; border-radius:999px; margin-bottom:.75rem; }
  .ko-pub__title{ font-size:1.12em; font-weight:700; line-height:1.3; color:#134e4a !important; margin:0 0 .5rem; }
  .ko-pub__excerpt{ margin:0 0 .9rem; color:#5c6a68; font-size:.95em; line-height:1.6; }
  .ko-pub__link{ font-weight:700; color:#0f766e !important; text-decoration:none; }
  .ko-pub__link:hover{ color:#115e59 !important; }
  .ko-contact{ margin:2.75rem 0 1rem; border-radius:16px; background:#f0faf7; border:1px solid #d9ede8; padding:1.9rem 2.1rem; }
  .ko-contact__inner{ display:flex; align-items:center; justify-content:space-between; gap:1.5rem; flex-wrap:wrap; }
  .ko-contact__title{ font-size:1.35em; font-weight:700; color:#134e4a !important; margin:0 0 .35rem; }
  .ko-contact__body{ margin:0; color:#3c4746; max-width:60ch; }
  .ko-contact__body a{ color:#115e59 !important; font-weight:600; border-bottom:1px solid rgba(15,118,110,.32) !important; }

  @media screen and (max-width:900px){ .ko-cards--3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media screen and (max-width:700px){
    .ko-hero{ flex-direction:column; text-align:center; padding:2rem 1.4rem; gap:1.4rem; }
    .ko-hero__photo img{ width:140px; height:140px; }
    .ko-hero__name{ font-size:2em; }
    .ko-hero__lede{ margin-left:auto; margin-right:auto; }
    .ko-hero__actions{ justify-content:center; }
    .ko-cards--3,.ko-cards--2{ grid-template-columns:1fr; }
    .ko-contact__inner{ flex-direction:column; align-items:flex-start; text-align:left; }
  }

  /* Inner-page mobile profile card */
  @media screen and (max-width:924px){
    div[itemtype*="schema.org/Person"]{ display:block; text-align:center; max-width:420px; margin:0 auto 1.5em; }
    .author__avatar{ display:block; width:auto; float:none; margin:0 auto; }
    .author__avatar img{ display:block; width:124px; height:124px; max-width:124px; margin:0 auto; padding:4px; border-radius:50%; object-fit:cover; border:1px solid #e7ecea; box-shadow:0 3px 14px rgba(0,0,0,.10); }
    .author__content{ display:block; width:100%; padding:0; margin-top:.7em; line-height:1.35; }
    .sidebar .author__name,.author__name{ font-size:1.3em; font-weight:700; margin:.3em 0 .15em; }
    .author__bio,.author__pronouns{ margin:.15em 0 .6em; color:#5a6066; font-size:.95em; }
    .author__urls-wrapper{ display:block; text-align:left; }
    .author__urls-wrapper > button.btn{ display:none; }
    .author__urls{ display:block !important; position:static !important; margin:0 auto; padding:.5em 0 0; max-width:260px; border:0; background:transparent; box-shadow:none; text-align:left; z-index:auto; }
    .author__urls:before,.author__urls:after{ display:none !important; }
    .author__urls li{ white-space:normal; border-bottom:1px solid #f0f1f2; }
    .author__urls li:last-child{ border-bottom:0; }
    .author__urls a{ display:block; padding:11px 6px; font-size:1em; color:#3a4045; border-bottom:0 !important; }
    .author__urls a:hover{ color:#0f766e; }
    .author__urls i,.author__urls .ai{ color:#0f766e; margin-right:4px; }
    .page{ padding-left:1em; padding-right:1em; }
    .greedy-nav .visible-links a{ padding-top:.6em; padding-bottom:.6em; }
  }
</style>

<!-- end custom head snippets -->
